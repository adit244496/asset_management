<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Executive midnight-navy surface gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Radiant Star-A gold gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE072" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
  </defs>

  <!-- Squircle base tile with precision radius -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" />

  <!-- Subtle tactile glass rim for crisp edge definition on any background -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Optically balanced and micro-scale weighted Star-A mark -->
  <g transform="translate(9.6, 10.4) scale(0.448)">
    <!-- Ascending left leg -->
    <path
      d="M 19.3 98.5 L 51.7 1.5"
      stroke="url(#goldGrad)"
      stroke-width="8.5"
      stroke-linecap="round"
    />
    <!-- Continuous right leg, under-slash, and extended crossbar -->
    <path
      d="M 51.7 1.5 L 80.6 89.7 L 1.5 43.3 L 98.5 27.6"
      stroke="url(#goldGrad)"
      stroke-width="8.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Reinforced bold right structural accent leg -->
    <path
      d="M 51.7 1.5 L 80.6 89.7"
      stroke="url(#goldGrad)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
