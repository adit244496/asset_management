# Serves the built Vite bundle and proxies the API, over HTTPS.
#
# A worked example for a production server, not a file the app reads. If you
# serve the bundle with IIS instead, it needs the equivalent of the rules
# below -- a reverse-proxy rule, a URL Rewrite rule, HTTPS and the body-size
# limit.
#
# The rules that matter:
#
#   1. /api is proxied to the backend, so the browser only ever talks to this
#      one origin. That mirrors Vite's dev proxy (see vite.config.js), keeps
#      the backend's address out of the JS bundle, and takes CORS out of the
#      picture entirely -- leave CORS_ORIGINS empty in backend/.env.
#
#   2. try_files falls back to index.html, which is required rather than
#      optional: the app uses React Router's BrowserRouter, so /report,
#      /history and /masters are client-side routes with no file behind them.
#      Without the fallback a refresh or a pasted deep link would 404.
#
#   3. client_max_body_size: a bulk upload is sent as one JSON body, and
#      nginx's 1 MB default refuses a few thousand rows with a 413 that the
#      dev server never shows.
#
#   4. HTTPS. Passwords and session tokens cross this connection; plain HTTP
#      only redirects.
#
# Set for your own server: server_name, the two certificate paths, `root`,
# and the upstream port. The backend must listen on 127.0.0.1 only (see
# backend/README.md, "Deploying"), so nothing reaches it except through here.

upstream asset_api {
    # waitress, from backend/README.md's deployment section.
    server 127.0.0.1:8000;
}

# Plain HTTP: nothing but a redirect.
server {
    listen 80;
    server_name itassets.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name itassets.example.com;

    ssl_certificate     C:/nginx/certs/itassets.crt;
    ssl_certificate_key C:/nginx/certs/itassets.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Output of `npm run build`. Forward slashes even on Windows.
    root E:/asset-management-it/frontend/dist;
    index index.html;

    # Bulk uploads (see 3. above).
    client_max_body_size 25m;

    # Nothing starting with a dot is ever served (.env, .git, ...). The
    # bundle has none; this is so a misplaced file cannot become public.
    location ~ /\. {
        deny all;
        return 404;
    }

    location /api/ {
        proxy_pass http://asset_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The assistant waits on an AI provider, and the data export builds
        # every register into a zip; both can outlast the 60 s default.
        proxy_read_timeout 180s;
    }

    # Caching is set with `expires`, never add_header, in these locations: an
    # add_header inside a location drops every one inherited from the server
    # block, and the security headers above would silently go with it.

    # Hashed asset filenames are content-addressed, so they can be cached hard.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        # index.html must not be cached, or a release is not seen until the
        # browser's copy expires. (-1 sends Cache-Control: no-cache.)
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
